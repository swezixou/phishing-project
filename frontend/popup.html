<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── En-tête ────────────────────────────────── -->
  <header class="header">
    <div class="header__icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <div class="header__text">
      <h1 class="header__title">Phishing Detector</h1>
      <p class="header__subtitle">SVM + Feature Engineering</p>
    </div>
  </header>

  <!-- ── Corps principal ───────────────────────── -->
  <main class="main">
    <button id="btn-analyze" class="btn btn--primary" type="button">
      Analyser cet email
    </button>

    <!-- Zone résultat (cachée par défaut via CSS) -->
    <section id="result" class="result" aria-live="polite" aria-atomic="true">
      <!-- Injecté dynamiquement par popup.js -->
    </section>
  </main>

  <!-- ── Pied de page ──────────────────────────── -->
  <footer class="footer">
    <span class="footer__status">
      <span id="status-dot" class="status-dot" aria-hidden="true"></span>
      <span id="status-text">Vérification...</span>
    </span>
    <span id="model-info" class="footer__model">SVM v1.0</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
